[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensquad"
version = "0.9.0"
description = "OpenSquad - Local-first Multi-Agent Collaboration Framework"
readme = "README.md"
license = "MIT"
authors = [
    { name = "OpenSquad Contributors" }
]
keywords = ["ai", "agents", "multi-agent", "llm", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # 3.12+ 兼容性说明：anyio 4.x 的 CancelScope 与 Python 3.12+ 的
    # _num_cancels_requested 计数器存在已知交互问题，但 anyio_patches.py 中的
    # 补丁已禁用（它破坏了 httpx 的 connect_tcp），runner.py 有自己的
    # CancelledError 安全网处理超时泄漏。因此 3.12/3.13 可以正常使用。
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "httpx>=0.25.0",
    "h11>=0.14.0",
    "openai>=1.10.0",
    "requests>=2.28.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.12.0",
    "python-dotenv>=1.0.0",
    "PyJWT[crypto]>=2.8.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.6",
    "tiktoken>=0.5.0",
    "certifi>=2023.0.0",
    "lark-oapi>=1.6.0",
    "packaging>=23.0",
    "psutil>=5.9.0",
    "greenlet>=3.1.1,<4.0",
    "mcp>=1.0",
    "prompt_toolkit>=3.0.36",
    "textual>=8.2.8",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "jieba>=0.42.1",
    "networkx>=3.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4.0",
    "mypy>=1.10",
]
websearch = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Imported directly by gateway/backend/run.py and the websearch service.
    # Pinned explicitly rather than relying on it arriving transitively
    # through playwright-stealth.
    "playwright>=1.40",
    "playwright-stealth>=1.0",
    # plugins/websearch/service/wash_content.py (module-level import)
    "trafilatura>=1.8",
    # plugins/websearch/service/pdf_processor.py: `import fitz`. Note this is
    # PyMuPDF, NOT PyPDF2 — the plugin's own requirements.txt used to name
    # PyPDF2, which nothing in the tree imports.
    "pymupdf>=1.24",
]
telegram = [
    # Imported by plugins/telegram/adapter.py. Was previously undeclared, so
    # `uv sync --extra dev` produced a venv where the telegram adapter could
    # not be imported and its regression tests failed on the CI gate.
    "python-telegram-bot>=21.0",
]
whisper = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "pycryptodome>=3.19",
]
google = [
    # Imported by opensquad/google_api.py (the GoogleAPI provider) through the
    # lazy _ensure_genai() probe. Previously undeclared, so on any machine
    # without it GoogleAPI silently initialised with _genai=None and
    # _convert_tools_to_google_format() returned an empty tool list -- the
    # provider looked configured but never sent a tool. The regression tests in
    # tests/test_claude_google_native_fc.py failed on the CI gate for the same
    # reason. Install with: pip install "opensquad[google]"
    "google-generativeai>=0.8.0",
]
all = [
    "opensquad[websearch,telegram,google,whisper]",
]

[project.urls]
Homepage = "https://github.com/opensquad-ai/opensquad"
Repository = "https://github.com/opensquad-ai/opensquad"
Issues = "https://github.com/opensquad-ai/opensquad/issues"

[project.scripts]
opensquad = "opensquad.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
# `opensquad` plus every default-resource dir the runtime resolves through
# syscfg.get_builtin_root() (i.e. the parent of the `opensquad` package).
# These must ship as top-level siblings in site-packages, mirroring the
# PyInstaller bundle layout in resources/backend-win/run/_internal/.
include = [
    "opensquad*",
    "skills",
    "plugins*",
    "model_cards*",
    "agents*",
    "pymcp*",
    "collab_cards*",
    "role_cards*",
    "prompts*",
]
# Belt for the `graft` lines in MANIFEST.in. Those sweep the whole tree, and
# setuptools' namespace-package discovery (PEP 420) happily walks into vendored
# JS trees and turns their `.py` files into modules — that is how 64
# `nexuschat-pro/node_modules/**.py` files reached the 0.8.47 wheel. MANIFEST.in
# governs the sdist only; a wheel built straight from the tree needs this.
exclude = [
    "*node_modules*",
    "*resources*",
    "*news2theme*",
    "*zt2theme*",
    "*j-space*",
    "*cursor-api*",
    "*vcs_collaboration*",
    "*playwright*",
]

[tool.setuptools.package-data]
opensquad = [
    "py.typed",
    "gateway/config.json",
    "gateway/nexuschat-pro/dist/**/*",
    "gateway/plugin_registry/*.json",
    # Distribution-name → import-name aliases used by the launcher's pip
    # dependency checks. Without it a pip install logs "using builtin aliases
    # only" and misjudges packages whose import name differs (bs4, cv2, fitz…).
    "launcher/*.json",
]
skills = ["**/*"]
plugins = ["**/*"]
# Credential-bearing dirs use an explicit allowlist instead of `*.json`, because
# a `*.json` glob cannot tell a tracked builtin from a local card/agent that
# carries the operator's own api_key. Keep both lists equal to `git ls-files`
# for those dirs — tests/test_verify_release_artifacts.py enforces it.
model_cards = [
    "builtin-sensevoice-asr.json",
    "deepseek-v4-flash.json",
    "deepseek-v4-pro.json",
    "step-image-edit-2.json",
    "stepaudio-2.5-asr.json",
    "stepaudio-2.5-chat.json",
    "stepaudio-2.5-realtime.json",
    "stepaudio-2.5-tts.json",
]
agents = ["coder/*", "image_bot/*", "pm/*", "qa/*"]
pymcp = ["*.json"]
collab_cards = ["*.md"]
role_cards = ["*.md"]
# System-prompt templates (`base|thought` × `fc|xml`) plus the `parts/`
# fragments they include. Every agent boot resolves them through
# syscfg.get_builtin_root() and raises "Base prompt not found" without them —
# 0.8.47/0.8.48 shipped no prompt file at all, so no agent could start from a
# pip/npm install. Recursive glob: `parts/` is a subdirectory.
prompts = ["**/*"]

# Belt for the `package_data` globs above, which bypass MANIFEST.in, and for
# anything that reaches the wheel through the sdist manifest. Patterns are
# fnmatch'd against package-relative paths, so `*` crosses `/` and one global
# pattern covers every depth. A per-package key is needed when the *package
# itself* is the private dir (its own relative paths carry no identifying
# segment).
[tool.setuptools.exclude-package-data]
"*" = [
    "*node_modules*",
    # Plugin UI lockfiles: build-time only, unused at runtime. The Windows-
    # generated ones are also the npm bug #4828 trap (win32-only optional deps).
    "*pnpm-lock.yaml",
    "*package-lock.json",
    "*yarn.lock",
    "*npm-shrinkwrap.json",
    # Plugin hot-reload marker, and ad-hoc debug dumps that carry absolute
    # workspace paths plus a bridge key.
    ".reload_ts",
    "*debug_config.txt",
    "*__pycache__*",
    "*.py[cod]",
    "*.log",
    "*.log.*",
    "*reranker/models*",
    "*.safetensors",
    "*.gguf",
    "*.onnx",
    "*.bin",
    "*.pt",
    "*.DS_Store",
]
# Private dirs reached through their *parent* package's `**/*` glob
# (`package_data[plugins]` sweeps `src/plugins/**`), so the pattern has to be
# keyed on the parent as well as on the private package itself. Scoped per dir
# rather than a global `*playwright*`: the repo tracks
# `gateway/nexuschat-pro/playwright.config.ts`, which an unscoped marker would
# silently drop from the wheel.
"plugins" = ["news2theme/*"]
"skills" = [
    "news2theme/*",
    "news2theme-ops/*",
    "zt2theme/*",
    "j-space/*",
    "cursor-api/*",
    "playwright/*",
    "vcs_collaboration/*",
]
"plugins.news2theme" = ["*"]
"skills.news2theme" = ["*"]
"skills.news2theme-ops" = ["*"]
"skills.zt2theme" = ["*"]
"skills.j-space" = ["*"]
"skills.cursor-api" = ["*"]
"skills.playwright" = ["*"]
"skills.vcs_collaboration" = ["*"]
"agents.agent301" = ["*"]

# ── Ruff linter & formatter ───────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "src/opensquad/gateway/nexuschat-pro/resources",
    "src/skills/j-space",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (warn on print statements)
    "G",    # flake8-logging-format (f-string in log calls)
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",     # line-too-long (handled by formatter)
    "N806",     # non-lowercase-variable-in-function (permissive for ML code)
    "T201",     # allow print() in non-production scripts
    # Legacy codebase — tighten incrementally (see ci-fast ruff job)
    "G003",     # logging-string-concat
    "G004",     # logging-f-string
    "G201",     # logging-exc-info
    "B008",     # function-call-in-default-argument (FastAPI Depends)
    "B904",     # raise-without-from-inside-except
    "E402",     # module-import-not-at-top-of-file
    "E701",     # multiple-statements-on-one-line-colon
    "E741",     # ambiguous-variable-name
    "N802",     # invalid-function-name
    "N803",     # invalid-argument-name
    "RUF001",   # ambiguous-unicode-character-string (Chinese docs)
    "RUF002",   # ambiguous-unicode-character-docstring
    "RUF003",   # ambiguous-unicode-character-comment
    "RUF006",   # asyncio-dangling-task
    "RUF012",   # mutable-class-default
    "SIM102",   # collapsible-if
    "SIM105",   # suppressible-exception
    "SIM108",   # if-else-block-instead-of-if-exp
    "SIM115",   # open-file-with-context-handler
    "SIM117",   # multiple-with-statements
    "B007",     # unused-loop-control-variable
    "B012",     # jump-statement-in-finally
    "B023",     # function-uses-loop-variable
    "N812",     # lowercase-imported-as-non-lowercase
    "N814",     # camelcase-imported-as-constant
    "N817",     # camelcase-imported-as-acronym
    "RUF034",   # useless-if-else
    "UP035",    # deprecated-import (typing.Dict etc.)
    "RUF100",   # unused-noqa
    "RUF059",   # unused-unpacked-variable (legacy tuple unpack)
    "RUF005",   # collection-literal-concatenation (legacy)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T201", "N802", "N803", "N806"]
"scripts/*" = ["T201"]
"src/plugins/*/adapter.py" = ["T201"]
"src/plugins/*/service/*.py" = ["T201"]
"conftest.py" = ["T201"]
"src/opensquad/_syscfg/__init__.py" = ["F401"]  # re-exports
"src/opensquad/_syscfg/_paths.py" = ["F401"]  # re-exports
"src/opensquad/launcher/__init__.py" = ["F401"]
"src/opensquad/tools/agent_memory_tool/memory/__init__.py" = ["F401"]
"src/plugins/sequential_think/sequential_thinking/__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A `def test_*` that *returns* a non-None value is almost always a converted
# script: pytest ignores the return value, so the test asserts nothing and
# passes unconditionally. Several files under tests/ were exactly that.
# Fail loudly instead of silently going green.
filterwarnings = [
    "error::pytest.PytestReturnNotNoneWarning",
]
# CI-5: coverage was previously forced for every local pytest run via global
# addopts, slowing local feedback by 20-40%. It is now enabled explicitly in
# CI (ci.yml full gate) via `pytest --cov=opensquad --cov-report=...`.
# Local runs stay fast: `pytest -q`.

# ── Coverage gate (ratchet) ───────────────────────────────
# Measured baseline: 21.3% line coverage over 214 modules of the ``opensquad``
# package (11,419 / 48,399 statements); 67 of those modules sit at 0%.
#
# HISTORICAL NOTE — read before "restoring" 80%: the previous comment here
# claimed a hard 80% floor that failed PRs. It never did. ci.yml passed
# ``--cov-fail-under=0`` to pytest and put the ``coverage report --fail-under``
# check behind ``continue-on-error: true``, so the number was never enforced and
# drifted unmeasured. The floor below is a *ratchet*: the number may go up but
# never down. Raising it to 80 means writing the missing tests, not editing this
# value. Regenerate the baseline with:
#     pytest --cov=opensquad --cov-report=term-missing
[tool.coverage.run]
source = ["opensquad"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    # Defensive only: `nexuschat-pro/` ships a frozen PyInstaller runtime plus
    # node_modules. It is not part of the measured set under the current
    # invocation, but a broader `--cov=src` run would sweep it in and make any
    # floor meaningless, so exclude it explicitly.
    "*/gateway/nexuschat-pro/*",
]

[tool.coverage.report]
fail_under = 21
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── Mypy type checking (progressive strictness) ──────────
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
strict = false
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false
