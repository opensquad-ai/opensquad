<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer border box (white bg, indigo border) -->
  <rect x="2" y="2" width="796" height="196" rx="16" ry="16"
        fill="white" stroke="#6366f1" stroke-width="2"/>

  <!-- Logo icon: 130x130, centered vertically (y: 35~165) -->
  <g transform="translate(35,35) scale(1.3)">
    <rect width="100" height="100" rx="18" ry="18" fill="url(#logo-grad)"/>
    <ellipse cx="50" cy="18" rx="30" ry="15" fill="white" fill-opacity="0.08"/>
    <!-- Edge lines -->
    <line x1="30" y1="30" x2="70" y2="30" stroke="white" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="30" y2="70" stroke="white" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="70" y1="30" x2="70" y2="70" stroke="white" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="30" y1="70" x2="70" y2="70" stroke="white" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/>
    <!-- Diagonal lines -->
    <line x1="30" y1="30" x2="70" y2="70" stroke="white" stroke-width="1.5" stroke-opacity="0.20" stroke-linecap="round"/>
    <line x1="70" y1="30" x2="30" y2="70" stroke="white" stroke-width="1.5" stroke-opacity="0.20" stroke-linecap="round"/>
    <!-- Nodes -->
    <circle cx="30" cy="30" r="8" fill="white" filter="url(#glow)"/>
    <circle cx="70" cy="30" r="8" fill="white" filter="url(#glow)"/>
    <circle cx="30" cy="70" r="8" fill="white" filter="url(#glow)"/>
    <circle cx="70" cy="70" r="8" fill="white" filter="url(#glow)"/>
  </g>

  <!-- Project name -->
  <text x="210" y="118"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="76" font-weight="700" fill="#1e1b4b" letter-spacing="-2">OpenSquad</text>

  <!-- Subtitle -->
  <text x="214" y="155"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" fill="#6366f1" letter-spacing="3">Multi-Agent Framework</text>
</svg>
