<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Static, self-contained launch screen: no scripts, no network. The only
         inline surface allowed is the stylesheet below. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <meta name="color-scheme" content="dark" />
    <title>OpenSquad</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body { height: 100%; margin: 0; }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        overflow: hidden;
        background: radial-gradient(120% 80% at 50% 0%, #1b1a2e 0%, #0f0f1a 62%, #0b0b12 100%);
        color: #e8e6f2;
        font-family: "DM Sans", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
        opacity: 0;
        animation: splash-in 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes splash-in { to { opacity: 1; } }

      .logo { width: 104px; height: 104px; }

      /* 四象限循环点亮（与 index.html 的 boot loader 同一套品牌动效）。
         负 animation-delay：页面一出现即处于错峰的稳定循环，无起始静止。 */
      @keyframes osq-quad-pulse {
        0%, 18%   { opacity: 0.20; }
        25%, 42%  { opacity: 1; }
        50%, 100% { opacity: 0.20; }
      }
      .osq-quad { animation: osq-quad-pulse 2.4s ease-in-out infinite; }
      .osq-quad-1 { animation-delay: -0.6s; }
      .osq-quad-2 { animation-delay: 0s; }
      .osq-quad-3 { animation-delay: -1.2s; }
      .osq-quad-4 { animation-delay: -1.8s; }

      .wordmark {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .caption {
        font-size: 12.5px;
        letter-spacing: 0.02em;
        color: #8f8ea3;
      }

      /* 不确定态进度条：开工到应用可用的这段时间并非可测量的等待。 */
      .bar {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #4E4CB8, #8257CC);
        animation: bar-slide 1.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes bar-slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }

      @media (prefers-reduced-motion: reduce) {
        body { animation: none; opacity: 1; }
        .osq-quad { animation: none; opacity: 0.65; }
        .bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <svg class="logo" viewBox="0 0 100 100" role="img" aria-label="OpenSquad">
      <defs>
        <linearGradient id="osq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4E4CB8" />
          <stop offset="100%" stop-color="#8257CC" />
        </linearGradient>
      </defs>
      <rect width="100" height="100" rx="18" ry="18" fill="url(#osq-bg)" />
      <ellipse cx="50" cy="16" rx="30" ry="12" fill="#ffffff" fill-opacity="0.08" />
      <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1">
        <line x1="50" y1="10" x2="50" y2="90" />
        <line x1="10" y1="50" x2="90" y2="50" />
      </g>
      <!-- 恒定光晕层（不参与 osq-quad 动画），亮灭只变中心圆亮度，视觉尺寸恒定。 -->
      <g fill="#ffffff" fill-opacity="0.10">
        <circle cx="30" cy="30" r="13" />
        <circle cx="70" cy="30" r="13" />
        <circle cx="30" cy="70" r="13" />
        <circle cx="70" cy="70" r="13" />
      </g>
      <g class="osq-quad osq-quad-1">
        <rect x="10" y="10" width="40" height="40" rx="10" fill="#ffffff" fill-opacity="0.12" />
        <circle cx="30" cy="30" r="8" fill="#ffffff" />
      </g>
      <g class="osq-quad osq-quad-2">
        <rect x="50" y="10" width="40" height="40" rx="10" fill="#ffffff" fill-opacity="0.12" />
        <circle cx="70" cy="30" r="8" fill="#ffffff" />
      </g>
      <g class="osq-quad osq-quad-3">
        <rect x="10" y="50" width="40" height="40" rx="10" fill="#ffffff" fill-opacity="0.12" />
        <circle cx="30" cy="70" r="8" fill="#ffffff" />
      </g>
      <g class="osq-quad osq-quad-4">
        <rect x="50" y="50" width="40" height="40" rx="10" fill="#ffffff" fill-opacity="0.12" />
        <circle cx="70" cy="70" r="8" fill="#ffffff" />
      </g>
    </svg>
    <div class="wordmark">OpenSquad</div>
    <div class="caption">Starting…</div>
    <div class="bar"></div>
  </body>
</html>
