    <style>
      /* Reset and Base */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      /* Agent 呼吸灯动画 */
      @keyframes breathe-idle {
        0%, 100% { opacity: 0.4; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes breathe-working {
        0%, 100% { opacity: 0.35; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes breathe-sleeping {
        0%, 100% { opacity: 0.15; transform: scale(0.9); }
        50% { opacity: 0.55; transform: scale(1); }
      }
      .animate-breathe-idle {
        animation: breathe-idle 3s ease-in-out infinite;
      }
      .animate-breathe-working {
        animation: breathe-working 1.5s ease-in-out infinite;
      }
      .animate-breathe-sleeping {
        animation: breathe-sleeping 4s ease-in-out infinite;
      }

      /* Solo activity: soft white light sliding across live title text */
      @keyframes solo-text-shimmer {
        0% { background-position: 120% 0; }
        100% { background-position: -120% 0; }
      }
      .solo-text-shimmer {
        background-image: linear-gradient(
          90deg,
          currentColor 0%,
          currentColor 38%,
          color-mix(in srgb, #ffffff 88%, currentColor) 50%,
          currentColor 62%,
          currentColor 100%
        );
        background-size: 220% 100%;
        background-repeat: no-repeat;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: solo-text-shimmer 1.7s ease-in-out infinite;
      }

      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        height: 100dvh; /* Dynamic viewport height for mobile */
      }

      /* Mobile-specific fixes */
      @supports (padding-top: env(safe-area-inset-top)) {
        .safe-area-top {
          padding-top: env(safe-area-inset-top);
        }
        .safe-area-bottom {
          padding-bottom: env(safe-area-inset-bottom);
        }
        .safe-area-x {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }

      /* Prevent pull-to-refresh on mobile */
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      /* Custom Scrollbar - hidden on mobile */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Hide scrollbar on mobile */
      @media (max-width: 768px) {
        ::-webkit-scrollbar {
          display: none;
        }
        * {
          scrollbar-width: none;
          -ms-overflow-style: none;
        }
      }

      /* Markdown Styles within Chat */
      .prose p { margin-bottom: 0.5em; }
      .prose p:last-child { margin-bottom: 0; }
      .prose ul { list-style-type: disc; padding-left: 1.2em; margin-bottom: 0.5em; }
      .prose ol { list-style-type: decimal; padding-left: 1.2em; margin-bottom: 0.5em; }
      .prose strong { font-weight: 700; }
      .prose em { font-style: italic; }
      .prose pre {
        overflow-x: auto;
        max-width: 100%;
        white-space: pre;
        word-wrap: normal;
        border-radius: 0.375rem;
        padding: 0.5em 0.75em;
        font-size: 0.8em;
        background-color: rgba(0,0,0,0.05);
      }
      .prose code {
        word-break: break-all;
        font-size: 0.85em;
      }
      .prose pre code {
        word-break: normal;
        background-color: transparent;
        padding: 0;
      }
      .dark .prose pre { background-color: var(--color-bg); border: 1px solid var(--color-border); }
      .dark .prose code { color: var(--color-primary); }
      .prose a { color: var(--color-primary); text-decoration: underline; cursor: pointer; }
      .prose a:hover { opacity: 0.8; }

      /* Ensure markdown content doesn't overflow containers */
      .ai-markdown { overflow-wrap: break-word; word-break: break-word; }
      .ai-markdown pre { overflow-x: auto; max-width: 100%; }
      .ai-markdown table { display: block; overflow-x: auto; max-width: 100%; }
      .ai-markdown img { max-width: 100%; height: auto; }

      .dark ::-webkit-scrollbar-thumb { background: #30363d; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #484f58; }

      /* Mobile input fixes */
      input, textarea {
        font-size: 16px; /* Prevent zoom on iOS */
        -webkit-appearance: none;
        border-radius: 0;
      }

      /* Touch action optimization */
      .touch-manipulation {
        touch-action: manipulation;
      }

      /* Prevent text selection on UI elements */
      .no-select {
        -webkit-user-select: none;
        user-select: none;
      }

  <!-- Mobile Auto Reload -->
  <script>
    (function() {
      // 只在移动端启用自动刷新
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (!isMobile) return;

      let lastModified = null;
      const checkInterval = 2000; // 每2秒检查一次

      setInterval(async () => {
        try {
          const response = await fetch('/index.tsx', { method: 'HEAD', cache: 'no-cache' });
          const currentModified = response.headers.get('last-modified');

          if (lastModified && currentModified !== lastModified) {
            console.log('[AutoReload] File changed, reloading...');
            window.location.reload();
          }
          lastModified = currentModified;
        } catch (e) {
          // 忽略错误
        }
      }, checkInterval);

      console.log('[AutoReload] Mobile auto-reload enabled');
    })();
  </script>
