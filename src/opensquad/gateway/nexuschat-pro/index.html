<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>OpenSquad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* Claude-inspired ink-green fallback (overridden by themeStore at runtime) */
        --color-primary: #3A6B52;
        --color-bg: #F6F3EC;
        --color-rail: #EFEBE3;
        --color-nest: #E8E3DA;
        --color-stage: #F6F3EC;
        --color-panel: #FFFEFB;
        --color-border: #E6DFD2;
        --color-bubble-self: #E8EDE8;
        --color-bubble-other: #FFFEFB;
        --color-text-main: #1F2A24;
        --color-text-muted: #6B736C;
        --chat-font-size: 1;
        --font-chat: "DM Sans", "Noto Sans SC", system-ui, sans-serif;
        --font-ui: "DM Sans", "Noto Sans SC", system-ui, sans-serif;
      }

      body {
        font-family: var(--font-ui);
        background: var(--color-bg);
        color: var(--color-text-main);
      }
    </style>
    <script>
      /* Early appearance class to reduce FOUC before React/themeStore */
      (function () {
        try {
          var raw = localStorage.getItem('opensquad_theme_v2');
          var mode = 'system';
          if (raw) {
            var p = JSON.parse(raw);
            if (p && (p.mode === 'light' || p.mode === 'dark' || p.mode === 'system')) mode = p.mode;
          }
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Reset and Base */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      /* Agent 呼吸灯动画 */
      @keyframes breathe-idle {
        0%, 100% { opacity: 0.4; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes breathe-working {
        0%, 100% { opacity: 0.35; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes breathe-sleeping {
        0%, 100% { opacity: 0.15; transform: scale(0.9); }
        50% { opacity: 0.55; transform: scale(1); }
      }
      .animate-breathe-idle {
        animation: breathe-idle 3s ease-in-out infinite;
      }
      .animate-breathe-working {
        animation: breathe-working 1.5s ease-in-out infinite;
      }
      .animate-breathe-sleeping {
        animation: breathe-sleeping 4s ease-in-out infinite;
      }

      /* Solo activity: soft white light sliding across live title text.
         Base color must be a CSS var — not currentColor — because text fill
         is transparent for background-clip; currentColor would also be
         transparent and the glyphs would vanish between shine passes. */
      @keyframes solo-text-shimmer {
        0% { background-position: 100% 0; }
        100% { background-position: -100% 0; }
      }
      .solo-text-shimmer {
        background-image: linear-gradient(
          90deg,
          var(--solo-shimmer-base) 0%,
          var(--solo-shimmer-base) 42%,
          color-mix(in srgb, #ffffff 72%, var(--solo-shimmer-base)) 50%,
          var(--solo-shimmer-base) 58%,
          var(--solo-shimmer-base) 100%
        );
        background-size: 200% 100%;
        background-repeat: repeat-x;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: var(--solo-shimmer-base);
        animation: solo-text-shimmer 1.7s linear infinite;
      }

      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        height: 100dvh; /* Dynamic viewport height for mobile */
      }

      /* Mobile-specific fixes */
      @supports (padding-top: env(safe-area-inset-top)) {
        .safe-area-top {
          padding-top: env(safe-area-inset-top);
        }
        .safe-area-bottom {
          padding-bottom: env(safe-area-inset-bottom);
        }
        .safe-area-x {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }

      /* iOS: content draws under status bar (viewport-fit=cover + black-translucent).
         Push the whole mobile UI down by safe-area + a small extra gap. */
      @media (max-width: 767px) {
        :root {
          --mobile-top-inset: calc(env(safe-area-inset-top, 0px) + 10px);
          --mobile-bottom-inset: env(safe-area-inset-bottom, 0px);
        }
        .mobile-safe-shell {
          padding-top: var(--mobile-top-inset);
          padding-bottom: var(--mobile-bottom-inset);
          padding-left: env(safe-area-inset-left, 0px);
          padding-right: env(safe-area-inset-right, 0px);
          box-sizing: border-box;
        }
        .mobile-safe-fixed {
          padding-top: var(--mobile-top-inset);
          padding-bottom: var(--mobile-bottom-inset);
          box-sizing: border-box;
        }
      }

      /* Prevent pull-to-refresh on mobile */
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      /* Custom Scrollbar - hidden on mobile */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Hide scrollbar on mobile */
      @media (max-width: 768px) {
        ::-webkit-scrollbar {
          display: none;
        }
        * {
          scrollbar-width: none;
          -ms-overflow-style: none;
        }
      }

      /* Markdown Styles within Chat */
      .prose p { margin-bottom: 0.5em; }
      .prose p:last-child { margin-bottom: 0; }
      .prose ul { list-style-type: disc; padding-left: 1.2em; margin-bottom: 0.5em; }
      .prose ol { list-style-type: decimal; padding-left: 1.2em; margin-bottom: 0.5em; }
      .prose strong { font-weight: 700; }
      .prose em { font-style: italic; }
      .prose pre {
        overflow-x: auto;
        max-width: 100%;
        white-space: pre;
        word-wrap: normal;
        border-radius: 0.375rem;
        padding: 0.5em 0.75em;
        font-size: 0.8em;
        background-color: rgba(0,0,0,0.05);
      }
      .prose code {
        word-break: break-all;
        font-size: 0.85em;
      }
      .prose pre code {
        word-break: normal;
        background-color: transparent;
        padding: 0;
      }
      .dark .prose pre { background-color: var(--color-bg); border: 1px solid var(--color-border); }
      .dark .prose code { color: var(--color-primary); }
      .prose a { color: var(--color-primary); text-decoration: underline; cursor: pointer; }
      .prose a:hover { opacity: 0.8; }

      /* Ensure markdown content doesn't overflow containers */
      .ai-markdown { overflow-wrap: break-word; word-break: break-word; }
      .ai-markdown pre { overflow-x: auto; max-width: 100%; }
      .ai-markdown table { display: block; overflow-x: auto; max-width: 100%; }
      .ai-markdown img { max-width: 100%; height: auto; }

      .dark ::-webkit-scrollbar-thumb { background: #30363d; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #484f58; }

      /* Mobile input fixes */
      input, textarea {
        font-size: 16px; /* Prevent zoom on iOS */
        -webkit-appearance: none;
        border-radius: 0;
      }

      /* Touch action optimization */
      .touch-manipulation {
        touch-action: manipulation;
      }

      /* Prevent text selection on UI elements */
      .no-select {
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "marked": "https://esm.sh/marked@12.0.0"
  }
}
</script>
</head>
  <body class="bg-bgLight text-textMain min-h-screen w-full overflow-hidden">
    <div id="root" class="h-full w-full overflow-hidden"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
