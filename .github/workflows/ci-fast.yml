name: CI (fast)

# Fast feedback pipeline. Runs on every push to the integration lines
# (main, dev) and on every PR targeting dev.
#
# Heavy checks (multi-OS deps matrix, multi-Python pytest matrix, mypy,
# bandit, pip-audit, CodeQL, doc-link check) live in ci.yml and run
# only on PRs targeting main (the release gate).
#
# This split keeps routine dev iteration cheap while preserving full
# coverage before anything lands in main.
#
# See BRANCHING.md for the branch model and CONTRIBUTING.md for the
# PR process.

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["dev"]

# Cancel in-flight runs on the same ref to save minutes on rapid pushes.
concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-guard:
    name: runtime tracking guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check disallowed tracked runtime files
        run: python scripts/check_runtime_tracking.py

  lint:
    name: ruff lint & format
    runs-on: ubuntu-latest
    needs: runtime-guard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  test:
    name: pytest (Python 3.11, no coverage)
    runs-on: ubuntu-latest
    needs: runtime-guard

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies with uv
        run: uv sync --python 3.11

      - name: Run tests
        env:
          PYTHONPATH: src
        run: uv run pytest tests/ -v --tb=short -q --no-cov

  frontend-smoke:
    name: frontend build smoke
    runs-on: ubuntu-latest
    needs: runtime-guard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/opensquad/gateway/nexuschat-pro/package-lock.json

      - name: Build frontend
        working-directory: src/opensquad/gateway/nexuschat-pro
        run: |
          npm ci
          npm run build

      - name: TypeScript type check
        working-directory: src/opensquad/gateway/nexuschat-pro
        run: npx tsc --noEmit

  secrets-scan:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    needs: runtime-guard

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | \
            tar -xz gitleaks && chmod +x gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --no-git
