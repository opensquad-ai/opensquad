name: CI (fast)

# Fast feedback pipeline. Runs on every push to the integration lines
# (main, dev), on every PR targeting dev, and on manual dispatch.
#
# Heavy checks (multi-OS deps matrix, pytest matrix, mypy, bandit,
# pip-audit, CodeQL, doc-link check) live in ci.yml and run only on PRs
# targeting main (the release gate).
#
# ── Why the pytest job below runs the WHOLE suite ────────────────────────
# It used to run seven hand-picked targets. Anything outside that list
# could not turn CI red, and the only other job that runs the full suite
# (ci.yml) fires on PRs targeting main -- this repo fast-forwards
# dev -> main without opening one, so ci.yml had not run since 2026-08-03.
# The curated list therefore *was* the entire backend gate.
#
# That is not theoretical. tests/test_asr_ffmpeg_resolver.py was red for
# months while every push reported green, because the failing assertion
# was one of the tests the list omitted.
#
# tests/known_failures.txt (strict-xfailed by tests/conftest.py) is the
# sanctioned way to record a genuinely pre-existing failure. Do not narrow
# this invocation back to a subset, and do not put `continue-on-error` on
# this job: a gate that cannot go red is not a gate.
#
# See BRANCHING.md for the branch model and CONTRIBUTING.md for the
# PR process.

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["dev"]
  # Lets the gate be re-run by hand, and lets a change to this workflow be
  # validated on a branch before it takes effect on dev/main.
  workflow_dispatch:

# Cancel in-flight runs on the same ref to save minutes on rapid pushes.
concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-guard:
    name: runtime tracking guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check disallowed tracked runtime files
        run: python scripts/check_runtime_tracking.py

  lint:
    name: ruff lint & format
    runs-on: ubuntu-latest
    needs: runtime-guard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==0.15.15"

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  test:
    name: pytest (Python 3.11, no coverage)
    runs-on: ubuntu-latest
    needs: runtime-guard

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies with uv
        # Extras must match ci.yml's `test` job. `--extra dev` alone is not
        # enough: the suite imports the websearch / telegram / google
        # adapters, so those tests would fail on a missing import rather than
        # on a real defect.
        run: uv sync --python 3.11 --extra dev --extra websearch --extra telegram --extra google

      - name: Install Playwright Chromium
        # The built-in browser's session tests drive a real Chromium, and the *package* is not the
        # *browser*: without this they failed here with "Executable doesn't exist at
        # /home/runner/...". The tests now skip where no browser is installed, and this step keeps
        # CI from being such a machine. continue-on-error: a download hiccup must not block the
        # gate, because the fallback (skip) is already correct.
        continue-on-error: true
        run: uv run --python 3.11 --with playwright playwright install chromium

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          uv run --python 3.11 pytest tests/ -v --tb=short -q --override-ini "addopts="

  frontend-smoke:
    name: frontend build smoke
    runs-on: ubuntu-latest
    needs: runtime-guard

    steps:
      - uses: actions/checkout@v4

      # jsdom 30 declares `engines: ^22.22.2 || ^24.15.0 || >=26.0.0`, and its
      # nested undici 8 reads `markAsUncloneable` off `node:worker_threads` --
      # an export Node 20 does not have. On Node 20 the first `new CacheStorage()`
      # throws "webidl.util.markAsUncloneable is not a function" and vitest aborts
      # before running anything. Twelve test files set `@vitest-environment jsdom`,
      # so this is not avoidable by dropping a test. 22.22.2 is the version the
      # suite is green on locally (49 files / 624 tests).
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: src/opensquad/gateway/nexuschat-pro/package.json

      - name: Build frontend
        working-directory: src/opensquad/gateway/nexuschat-pro
        run: |
          npm install --no-package-lock
          npm test
          npm run build

  secrets-scan:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    needs: runtime-guard

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | \
            tar -xz gitleaks && chmod +x gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --no-git --config .gitleaks.toml

  dep-audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    needs: runtime-guard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # CI base Python ships setuptools 79.0.1 (PYSEC-2026-3447); upgrade
        # before auditing so the scan is not poisoned by the runner image.
        # Same invocation as the `sca` job in ci.yml, so one scanner does not
        # carry two different sensitivity settings.
        run: pip install -U setuptools && pip-audit --strict --progress-spinner=off --desc on

  version-sync:
    name: version sync check
    runs-on: ubuntu-latest
    needs: runtime-guard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify __init__.py and package.json match pyproject.toml
        run: python scripts/sync_version.py --check
