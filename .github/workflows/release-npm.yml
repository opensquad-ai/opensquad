name: Release (npm)

# Publishes the opensquad-ai npm package on every `v*` tag — test builds
# (alpha / beta / rc) included, so a tester can install them the way a user
# would: `npm install -g opensquad-ai@next`.
# The package is a thin Node.js wrapper that installs the Python
# `opensquad` CLI and proxies commands to it. See bin/opensquad.js.
#
# A test build is published under the `next` dist-tag instead of `latest`, so
# `npm install -g opensquad-ai` keeps resolving to the last stable release.
# The wrapper pins `pip install opensquad==<npm version>`; the dashed npm
# spelling (`0.8.49-alpha.1`) is the same PEP 440 version as the PyPI one
# (`0.8.49a1`), which pip normalizes for comparison.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC token for npm trusted publishing (no NPM_TOKEN)

jobs:
  validate:
    name: Validate version sync
    runs-on: ubuntu-latest
    outputs:
      npm_version: ${{ steps.check.outputs.npm_version }}
      dist_tag: ${{ steps.check.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag vs package.json version
        id: check
        run: |
          NPM_VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Tag version:     $TAG_VERSION"
            echo "package.json:    $NPM_VERSION"
            if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
              echo "::error::Version mismatch! tag=$TAG_VERSION package.json=$NPM_VERSION"
              exit 1
            fi
          else
            # workflow_dispatch — re-publishing a tag whose job failed, or a
            # deliberate manual publish. There is no tag name on a branch ref,
            # so package.json is the source of truth: dispatch from the branch
            # that carries the released version.
            echo "Dispatch on '${GITHUB_REF_NAME}'; publishing package.json version $NPM_VERSION"
          fi
          # Test builds go to `next` so `npm install -g opensquad-ai` (which
          # resolves `latest`) keeps handing out the stable release. `-dev`
          # covers a `workflow_dispatch` from the dev branch: a snapshot must
          # never be able to take the `latest` tag either.
          case "$NPM_VERSION" in
            *-alpha*|*-beta*|*-rc*|*-dev*) DIST_TAG=next ;;
            *)                             DIST_TAG=latest ;;
          esac
          echo "Version check passed: $NPM_VERSION (dist-tag: $DIST_TAG)"
          echo "npm_version=$NPM_VERSION" >> $GITHUB_OUTPUT
          echo "dist_tag=$DIST_TAG" >> $GITHUB_OUTPUT

  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `registry-url`: with it, setup-node writes an .npmrc carrying
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and exports a
      # placeholder NODE_AUTH_TOKEN ("XXXXX-XXXXX-XXXXX-XXXXX"). npm then treats
      # the registry as token-authenticated and never attempts the OIDC
      # exchange — the publish fails `404 Not Found - PUT .../<pkg>` (reads like
      # "package missing") or `ENEEDAUTH`. The registry is passed to the publish
      # command instead, below. See actions/setup-node#1440.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Trusted publishing needs npm CLI >= 11.5.1 — pin it rather than trusting
      # whatever npm the runner image ships with. Deliberately *not* `@latest`:
      # npm 12 is out and no longer performs the OIDC exchange (publish then
      # dies in `ENEEDAUTH` even though the runner exposes the OIDC vars).
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: npm install --omit=dev --ignore-scripts

      - name: Verify bin file
        run: |
          test -f bin/opensquad.js || (echo "::error::bin/opensquad.js missing" && exit 1)
          node -e "require('./bin/opensquad.js')" || true   # syntax check only

      # No NODE_AUTH_TOKEN: the OIDC token granted by `id-token: write` is
      # exchanged for publish rights through the trusted publisher configured on
      # npmjs.com (owner opensquad-ai, repo opensquad, workflow release-npm.yml).
      # The registry is named here because setup-node does not write an .npmrc
      # for us any more (see its comment above).
      # `--tag next` for a test build: npm would otherwise refuse to move
      # `latest` onto a prerelease anyway, but naming the tag makes the intent
      # explicit and gives testers a stable handle (`-ai@next`). Stable tags
      # keep npm's default (`latest`).
      # `--loglevel verbose` on purpose: when the trusted-publishing token
      # exchange fails, npm logs the reason only at verbose/silly
      # ("Failed token exchange request with body message: ...") and then
      # degrades silently into a bare `ENEEDAUTH` / misleading `404`.
      - name: Publish to npm
        run: |
          npm publish --registry=https://registry.npmjs.org --access public --provenance \
            --tag "${{ needs.validate.outputs.dist_tag }}" --loglevel verbose

      # `npm publish` exits 0 even when the version only reaches npm's staging
      # area: trusted publishers may always stage, and npm routes dual-use
      # packages (an AI coding agent qualifies) through staging by policy. Read
      # the registry afterwards so a staged release cannot pass for a published
      # one — that mistake is invisible in the job output otherwise.
      # The check asks for *this version* rather than reading `latest`: a test
      # build never becomes `latest`, so a latest-based check would report every
      # prerelease as staged even when it is public.
      - name: Report whether the version is public or only staged
        run: |
          V="${{ needs.validate.outputs.npm_version }}"
          echo "dist-tags: $(curl -s -m 20 https://registry.npmjs.org/-/package/opensquad-ai/dist-tags || true)"
          if npm view "opensquad-ai@$V" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
            echo "::notice::opensquad-ai@$V is public — https://www.npmjs.com/package/opensquad-ai"
          else
            echo "::warning::opensquad-ai@$V is not public yet (almost certainly staged). Approve it with 2FA at https://www.npmjs.com/package/opensquad-ai -> Staged Packages, or run: npm stage list opensquad-ai && npm stage approve <stage-id>"
          fi

      - name: Summary
        run: |
          V="${{ needs.validate.outputs.npm_version }}"
          T="${{ needs.validate.outputs.dist_tag }}"
          echo "opensquad-ai@$V pushed to npm (dist-tag: $T)"
          if [ "$T" = "next" ]; then
            echo "Test build — install with:  npm install -g opensquad-ai@next"
            echo "Stable users keep:          npm install -g opensquad-ai"
          else
            echo "Install with:  npm install -g opensquad-ai"
          fi
          echo "Try with:      npx -p opensquad-ai opensquad --version"
