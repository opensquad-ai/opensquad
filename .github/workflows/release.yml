name: Release

# Publishes every `v*` tag, test builds included.
#
# Test builds (alpha / beta / rc) are opt-in everywhere and land in exactly the
# same artifact channels as a stable release, so a tester can install them the
# way a user would:
#   pip install --pre opensquad==0.8.49a1        # pip skips prereleases by default
#   npm install -g opensquad-ai@next             # npm keeps `latest` untouched
# Stable users are unaffected: `pip install opensquad` and
# `npm install -g opensquad-ai` still resolve to the last stable release, the
# Docker `:latest` tag is not moved, and the GitHub Release is flagged
# `prerelease`, which keeps it out of `/releases/latest` (what the in-app
# update check reads). Note the one irreversible cost: a PyPI version cannot be
# deleted, only yanked — a bad test build is superseded by a2/b1, never reused.
#
# Tag spelling is the npm one (`v0.8.49-alpha.1`); pyproject.toml carries the
# PEP 440 one (`0.8.49a1`). scripts/sync_version.py owns that mapping and
# validates the pair (`--check-tag`).

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Step 1: Validate the tag against pyproject.toml ──
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      # The tag spelling is the npm/semver one (`v0.8.49-alpha.1`), pyproject.toml
      # holds the PEP 440 one (`0.8.49a1`). scripts/sync_version.py owns that
      # mapping and compares both sides through it — the previous "delete every
      # hyphen" comparison only ever matched a `-alpha1` tag and would have
      # rejected `-alpha.1`.
      - name: Check tag matches pyproject.toml version
        id: check
        run: |
          python3 scripts/sync_version.py --check-tag "${GITHUB_REF_NAME}"
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE=true ;;
            *)                      PRERELEASE=false ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (prerelease=$PRERELEASE)"

  # ── Step 2: Build & push Docker image (stable tags only) ──
  # A test build gets no image: testers install from pip/npm/the desktop
  # installers, and the `:latest` tag must keep pointing at a stable release.
  docker:
    name: Build Docker image
    needs: validate
    if: needs.validate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 3: Publish to PyPI (every tag, test builds included) ──
  # A prerelease on PyPI is invisible to `pip install opensquad`: pip skips
  # prereleases unless they are named (`opensquad==0.8.49a1`) or `--pre` is
  # passed, and `pip install -U opensquad` keeps resolving to the last stable
  # release. (The earlier note here claimed a prerelease "would show up as
  # candidate Latest" — it does not.) What *is* true: an uploaded version can
  # never be deleted, only yanked, so a broken test build is replaced by a2/b1.
  pypi:
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The wheel's package-data ships the built web UI
      # (opensquad/gateway/nexuschat-pro/dist/**), and dist/ is a gitignored build
      # artifact — without this step `python -m build` silently produces a wheel
      # with no frontend at all (v0.8.46 run: 0 frontend files in the wheel).
      # The committed package-lock.json is generated on Windows and only records
      # win32 optional deps, so it must be dropped or npm skips
      # @rollup/rollup-linux-x64-gnu on this runner (npm bug #4828).
      - name: Build frontend
        working-directory: src/opensquad/gateway/nexuschat-pro
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --no-package-lock --ignore-scripts
          npm run build

      # Runs before the build so a checkout that carries something a build would
      # sweep in fails in seconds, not after a multi-minute build.
      - name: Verify the checkout is clean of local caches
        run: python scripts/verify_release_artifacts.py --tree

      - name: Build package
        run: python -m build

      # Last line of defence before the public upload:
      #  - no private plugin/skill, model cache, node_modules or .env may ship
      #    (npm install above means node_modules/ exists when `python -m build`
      #    sweeps the tree — that is how 64 vendored .py files once leaked in),
      #  - every shipped file must be tracked by git,
      #  - the default resources (model_cards/plugins/agents/pymcp/…) and the
      #    built web UI must actually be in the wheel.
      - name: Verify release artifacts
        run: python scripts/verify_release_artifacts.py dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing — no API token needed
        # Configure at: https://pypi.org/manage/project/opensquad/settings/publishing/

  # ── Step 4: Create GitHub Release ──
  release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags + history, so the previous tag actually resolves

      # The release body is the curated CHANGELOG.md section for this tag.
      # Deriving it from a commit list used to be silently empty: on a shallow
      # checkout `git tag --sort=-v:refname | head -2 | tail -1` resolves to the
      # tag being released, so `git log <tag>..HEAD` had nothing in it and both
      # v0.8.46 and v0.8.47 shipped a blank "Changes since …" body.
      # A test build may head its section with either spelling, so look for the
      # tag form (`0.8.49-alpha.1`) and the PEP 440 form (`0.8.49a1`).
      - name: Build release body from CHANGELOG.md
        id: notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys

          tag = os.environ["REF_NAME"]
          version = tag.lstrip("v")
          prerelease = any(s in tag for s in ("-rc", "-beta", "-alpha"))

          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          headings = [version]
          pep440 = re.sub(
              r"-(alpha|beta|rc)\.?(\d*)$",
              lambda m: {"alpha": "a", "beta": "b", "rc": "rc"}[m.group(1)] + m.group(2),
              version,
          )
          if pep440 != version:
              headings.append(pep440)

          body = ""
          for heading in headings:
              match = re.search(
                  rf"^## \[{re.escape(heading)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                  text,
                  re.S | re.M,
              )
              if match and match.group(1).strip():
                  body = match.group(1).strip()
                  break

          if not body and not prerelease:
              sys.exit(f"CHANGELOG.md has no '## [{version}]' section - write it before tagging {tag}")

          if not body:  # pre-release without its own section: fall back to commits
              prev = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
                  capture_output=True, text=True,
              ).stdout.strip()
              rng = f"{prev}..{tag}" if prev else tag
              log = subprocess.run(
                  ["git", "log", rng, "--pretty=format:- %s (%h)", "--no-merges"],
                  capture_output=True, text=True,
              ).stdout.strip()
              body = f"## Changes since {prev or 'the initial release'}\n\n{log}" if log else "_No changelog entry for this pre-release._"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("body<<NOTES_EOF\n" + body + "\nNOTES_EOF\n")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          # Appends GitHub's own "What's Changed" + compare link under the curated notes.
          generate_release_notes: true
          # `prerelease` keeps the Release out of `/releases/latest`, which is
          # what the in-app update check reads — a test build must never be
          # offered to stable users. See the validate job for the source of truth.
          prerelease: ${{ needs.validate.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
