name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Step 1: Validate version matches pyproject.toml ──
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python3 -c "
          with open('pyproject.toml') as f:
              for line in f:
                  if line.strip().startswith('version'):
                      print(line.split('=',1)[1].strip().strip('\"').strip(\"'\"))
                      break
          ")
          # Tag uses human-friendly prerelease suffix (-rc1, -beta1, -alpha1)
          # but PEP 440 requires no hyphen in the version itself. Normalize
          # both sides by stripping hyphens before comparing.
          TAG_NORM=$(echo "$TAG_VERSION" | tr -d '-')
          PYPROJECT_NORM=$(echo "$PYPROJECT_VERSION" | tr -d '-')
          echo "Tag version: $TAG_VERSION (normalized: $TAG_NORM)"
          echo "pyproject.toml version: $PYPROJECT_VERSION (normalized: $PYPROJECT_NORM)"
          if [ "$TAG_NORM" != "$PYPROJECT_NORM" ]; then
            echo "::error::Version mismatch! Tag=$TAG_VERSION, pyproject.toml=$PYPROJECT_VERSION"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

  # ── Step 2: Build & push Docker image ──
  docker:
    name: Build Docker image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 3: Publish to PyPI ──
  # Skipped for prerelease tags (rc / beta / alpha) — those would pollute
  # the production PyPI index and show up as candidate Latest for users
  # running `pip install opensquad`. Add TestPyPI trusted-publishing config
  # to a separate job if rc/beta/alpha artifacts are wanted externally.
  pypi:
    name: Publish to PyPI
    needs: validate
    if: |
      !contains(github.ref_name, '-rc') &&
      !contains(github.ref_name, '-beta') &&
      !contains(github.ref_name, '-alpha')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing — no API token needed
        # Configure at: https://pypi.org/manage/project/opensquad/settings/publishing/

  # ── Step 4: Create GitHub Release ──
  release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate changelog from commits
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            echo "body=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
            {
              echo "body<<EOF"
              echo "## Changes since ${PREV_TAG}"
              echo ""
              echo "$CHANGES"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
