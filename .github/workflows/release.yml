name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*beta*'   # beta tags only trigger Build Desktop App (test builds)
      - '!v*rc*'     # same for release candidates
      - '!v*alpha*'  # and alpha prereleases

jobs:
  # ── Step 1: Validate version matches pyproject.toml ──
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python3 -c "
          with open('pyproject.toml') as f:
              for line in f:
                  if line.strip().startswith('version'):
                      print(line.split('=',1)[1].strip().strip('\"').strip(\"'\"))
                      break
          ")
          # Tag uses human-friendly prerelease suffix (-rc1, -beta1, -alpha1)
          # but PEP 440 requires no hyphen in the version itself. Normalize
          # both sides by stripping hyphens before comparing.
          TAG_NORM=$(echo "$TAG_VERSION" | tr -d '-')
          PYPROJECT_NORM=$(echo "$PYPROJECT_VERSION" | tr -d '-')
          echo "Tag version: $TAG_VERSION (normalized: $TAG_NORM)"
          echo "pyproject.toml version: $PYPROJECT_VERSION (normalized: $PYPROJECT_NORM)"
          if [ "$TAG_NORM" != "$PYPROJECT_NORM" ]; then
            echo "::error::Version mismatch! Tag=$TAG_VERSION, pyproject.toml=$PYPROJECT_VERSION"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

  # ── Step 2: Build & push Docker image ──
  docker:
    name: Build Docker image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 3: Publish to PyPI ──
  # Skipped for prerelease tags (rc / beta / alpha) — those would pollute
  # the production PyPI index and show up as candidate Latest for users
  # running `pip install opensquad`. Add TestPyPI trusted-publishing config
  # to a separate job if rc/beta/alpha artifacts are wanted externally.
  pypi:
    name: Publish to PyPI
    needs: validate
    if: |
      !contains(github.ref_name, '-rc') &&
      !contains(github.ref_name, '-beta') &&
      !contains(github.ref_name, '-alpha')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The wheel's package-data ships the built web UI
      # (opensquad/gateway/nexuschat-pro/dist/**), and dist/ is a gitignored build
      # artifact — without this step `python -m build` silently produces a wheel
      # with no frontend at all (v0.8.46 run: 0 frontend files in the wheel).
      # The committed package-lock.json is generated on Windows and only records
      # win32 optional deps, so it must be dropped or npm skips
      # @rollup/rollup-linux-x64-gnu on this runner (npm bug #4828).
      - name: Build frontend
        working-directory: src/opensquad/gateway/nexuschat-pro
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --no-package-lock --ignore-scripts
          npm run build

      - name: Build package
        run: python -m build

      # Last line of defence before the public upload:
      #  - no private plugin/skill, model cache, node_modules or .env may ship
      #    (npm install above means node_modules/ exists when `python -m build`
      #    sweeps the tree — that is how 64 vendored .py files once leaked in),
      #  - every shipped file must be tracked by git,
      #  - the default resources (model_cards/plugins/agents/pymcp/…) and the
      #    built web UI must actually be in the wheel.
      - name: Verify release artifacts
        run: python scripts/verify_release_artifacts.py dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing — no API token needed
        # Configure at: https://pypi.org/manage/project/opensquad/settings/publishing/

  # ── Step 4: Create GitHub Release ──
  release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags + history, so the previous tag actually resolves

      # The release body is the curated CHANGELOG.md section for this tag.
      # Deriving it from a commit list used to be silently empty: on a shallow
      # checkout `git tag --sort=-v:refname | head -2 | tail -1` resolves to the
      # tag being released, so `git log <tag>..HEAD` had nothing in it and both
      # v0.8.46 and v0.8.47 shipped a blank "Changes since …" body.
      - name: Build release body from CHANGELOG.md
        id: notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys

          tag = os.environ["REF_NAME"]
          version = tag.lstrip("v")
          prerelease = any(s in tag for s in ("-rc", "-beta", "-alpha"))

          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.S | re.M,
          )
          body = match.group(1).strip() if match else ""

          if not body and not prerelease:
              sys.exit(f"CHANGELOG.md has no '## [{version}]' section - write it before tagging {tag}")

          if not body:  # pre-release without its own section: fall back to commits
              prev = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
                  capture_output=True, text=True,
              ).stdout.strip()
              rng = f"{prev}..{tag}" if prev else tag
              log = subprocess.run(
                  ["git", "log", rng, "--pretty=format:- %s (%h)", "--no-merges"],
                  capture_output=True, text=True,
              ).stdout.strip()
              body = f"## Changes since {prev or 'the initial release'}\n\n{log}" if log else "_No changelog entry for this pre-release._"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("body<<NOTES_EOF\n" + body + "\nNOTES_EOF\n")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          # Appends GitHub's own "What's Changed" + compare link under the curated notes.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
