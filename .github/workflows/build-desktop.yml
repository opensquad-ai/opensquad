name: Build Desktop App

on:
  push:
    tags:
      - 'v*'          # 推送 tag（如 v1.0.0）时触发正式构建
  workflow_dispatch:  # 也支持手动触发

jobs:
  # ── 第一步：各平台分别构建 Python 后端 ──────────────────────────────────────
  build-backend:
    name: Build Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: backend-win
            exe_name: run.exe
          - os: macos-latest
            artifact: backend-mac
            exe_name: run
          - os: ubuntu-latest
            artifact: backend-linux
            exe_name: run

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project and backend deps
        working-directory: .
        run: |
          pip install -e .
          pip install pyinstaller
          pip install Pillow playwright
          playwright install chromium

      - name: Build desktop app icons
        working-directory: .
        run: python scripts/build_icons.py

      - name: Build frontend (required before PyInstaller)
        working-directory: src/opensquad/gateway/nexuschat-pro
        run: |
          npm ci
          npm run build

      - name: Run PyInstaller
        working-directory: .
        # Single-line command — the backslash-continuation form below works
        # on bash (Linux/macOS runners) but breaks on Windows PowerShell,
        # which interprets the leading '--' of --distpath / --workpath as
        # the unary decrement operator.
        run: pyinstaller src/opensquad/gateway/backend/opensquad_backend.spec --distpath build/${{ matrix.artifact }} --workpath build/.pyinstaller-work --clean --noconfirm

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}/run/
          retention-days: 1

  # ── 第二步：组装 Electron 安装包 ─────────────────────────────────────────────
  build-electron:
    name: Build Electron (${{ matrix.os }})
    needs: build-backend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            backend_artifact: backend-win
            npm_script: electron:win
          - os: macos-latest
            backend_artifact: backend-mac
            npm_script: electron:mac
          - os: ubuntu-latest
            backend_artifact: backend-linux
            npm_script: electron:linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/opensquad/gateway/nexuschat-pro/package-lock.json

      - name: Set up Python and Playwright for icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow + Playwright + Chromium
        run: |
          pip install Pillow playwright
          playwright install chromium

      - name: Build desktop app icons
        run: python scripts/build_icons.py

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.backend_artifact }}
          path: build/${{ matrix.backend_artifact }}/run

      - name: Make backend executable (macOS/Linux)
        if: runner.os != 'Windows'
        run: chmod +x build/${{ matrix.backend_artifact }}/run/run

      - name: Install npm dependencies
        working-directory: src/opensquad/gateway/nexuschat-pro
        run: npm ci

      - name: Build Electron app
        working-directory: src/opensquad/gateway/nexuschat-pro
        run: npm run ${{ matrix.npm_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            build/release/*.exe
            build/release/*.dmg
            build/release/*.AppImage
            build/release/*.deb
          retention-days: 7

  # ── 第三步：将桌面产物附加到 GitHub Release（仅 tag 触发时） ────────────────
  # release.yml 负责创建 Release 并生成正文 / prerelease 标记；
  # 本工作流仅把桌面安装包附加到同名的 Release 上，不生成正文，避免与
  # release.yml 竞态覆盖 Release 正文。
  attach-to-release:
    name: Attach desktop artifacts to Release
    needs: build-electron
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files/

      - name: Attach artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
