name: Build Desktop App

on:
  push:
    tags:
      - 'v*'          # 推送 tag（如 v1.0.0）时触发正式构建
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Attach built installers to this GitHub Release tag (e.g. v0.4.1).
          Leave empty to build only (no Release upload). Use this to refresh
          Assets on an existing release without re-tagging.
        required: false
        type: string

# macOS desktop floor: Monterey 12+ (Electron 40). Pin macos-15 — do not use
# macos-latest (newer Xcode/SDK can raise Mach-O minOS when deployment target
# is unset). macos-13 is retired; macos-14 is deprecating. Set
# MACOSX_DEPLOYMENT_TARGET=12.0 only on macOS job steps below.

jobs:
  # ── 第一步：各平台分别构建 Python 后端 ──────────────────────────────────────
  build-backend:
    name: Build Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: backend-win
            exe_name: run.exe
          - os: macos-15
            artifact: backend-mac
            exe_name: run
          - os: ubuntu-latest
            artifact: backend-linux
            exe_name: run

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify Python 3.11 interpreter
        run: python scripts/check_build_python.py

      - name: Install project and backend deps
        working-directory: .
        run: |
          pip install -e .
          pip install pyinstaller
          pip install Pillow playwright
          playwright install chromium
        env:
          # Also applies when compiling any source wheels on macOS.
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '12.0' || '' }}

      - name: Build desktop app icons
        working-directory: .
        run: python scripts/build_icons.py

      - name: Build frontend (required before PyInstaller)
        working-directory: src/opensquad/gateway/nexuschat-pro
        # rollup's platform-specific optional binaries (@rollup/rollup-darwin-arm64,
        # @rollup/rollup-linux-x64-gnu, etc.) are not resolved correctly by npm
        # when a lock file generated on a different OS is present (npm bug #4828).
        # Remove any stale lock file + node_modules, then install fresh so npm
        # resolves the correct platform-specific optional deps for THIS runner.
        # Use a shell that supports rm -rf on all platforms.
        shell: bash
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --no-package-lock
          npm run build

      - name: Run PyInstaller
        working-directory: .
        # Single-line command — the backslash-continuation form below works
        # on bash (Linux/macOS runners) but breaks on Windows PowerShell,
        # which interprets the leading '--' of --distpath / --workpath as
        # the unary decrement operator.
        run: pyinstaller src/opensquad/gateway/backend/opensquad_backend.spec --distpath build/${{ matrix.artifact }} --workpath build/.pyinstaller-work --clean --noconfirm
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '12.0' || '' }}

      - name: Verify PyInstaller bundle is Python 3.11
        run: python scripts/check_build_python.py --bundle build/${{ matrix.artifact }}/run

      - name: Check macOS deployment target (backend)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="build/${{ matrix.artifact }}/run/run"
          echo "Inspecting minOS on $BIN"
          # Prefer LC_BUILD_VERSION minos; fall back to LC_VERSION_MIN_MACOSX.
          MINOS=$(otool -l "$BIN" | awk '
            /LC_BUILD_VERSION/ { in_bv=1; next }
            /LC_VERSION_MIN_MACOSX/ { in_vmin=1; next }
            in_bv && /minos/ { print $2; exit }
            in_vmin && /version/ { print $2; exit }
            /^Load command/ { in_bv=0; in_vmin=0 }
          ')
          echo "Detected minOS: ${MINOS:-unknown}"
          if [[ -z "${MINOS}" ]]; then
            echo "::warning::Could not parse minOS from $BIN (otool layout may differ)"
            exit 0
          fi
          # Fail if minOS major > 12 (e.g. 13.0 / 14.0 / 15.0).
          MAJOR="${MINOS%%.*}"
          if [[ "$MAJOR" =~ ^[0-9]+$ ]] && (( MAJOR > 12 )); then
            echo "::error::Backend binary minOS is $MINOS (want <= 12.x for macOS Monterey+). Check MACOSX_DEPLOYMENT_TARGET."
            exit 1
          fi
          echo "Backend minOS $MINOS is OK for macOS 12+"

      - name: Static check frozen writable paths
        if: runner.os == 'Windows'
        run: python scripts/check_frozen_writable_paths.py

      - name: Static check frozen native extensions
        if: runner.os == 'Windows'
        run: python scripts/check_frozen_native_exts.py
        # Catches the class of bug where PyInstaller collect_submodules was
        # used instead of collect_all for packages with C extensions (.pyd),
        # resulting in empty __init__.py placeholders and AttributeError at
        # runtime (e.g. httptools.HttpRequestParser).

      - name: Frozen smoke tests (Windows backend gate)
        if: runner.os == 'Windows'
        run: python scripts/smoke_frozen_all.py

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}/run/
          retention-days: 1

  # ── 第二步：组装 Electron 安装包 ─────────────────────────────────────────────
  build-electron:
    name: Build Electron (${{ matrix.os }})
    needs: build-backend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            backend_artifact: backend-win
            npm_script: electron:win
          - os: macos-15
            backend_artifact: backend-mac
            npm_script: electron:mac
          - os: ubuntu-latest
            backend_artifact: backend-linux
            npm_script: electron:linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python and Playwright for icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow + Playwright + Chromium
        run: |
          pip install Pillow playwright
          playwright install chromium

      - name: Build desktop app icons
        run: python scripts/build_icons.py

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.backend_artifact }}
          path: build/${{ matrix.backend_artifact }}/run

      - name: Make backend executable (macOS/Linux)
        if: runner.os != 'Windows'
        run: chmod +x build/${{ matrix.backend_artifact }}/run/run

      - name: Install npm dependencies
        working-directory: src/opensquad/gateway/nexuschat-pro
        shell: bash
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --no-package-lock

      - name: Build Electron app
        working-directory: src/opensquad/gateway/nexuschat-pro
        shell: bash
        run: |
          set -euo pipefail
          # Without a Developer ID cert, force unsigned packaging so CI does not
          # fail looking for a keychain identity. When CSC_LINK is set in repo
          # secrets, electron-builder signs; notarize.cjs runs if Apple creds exist.
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ -z "${CSC_LINK:-}" ]]; then
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              echo "No CSC_LINK secret — building unsigned macOS app (Gatekeeper will warn)."
            else
              echo "CSC_LINK present — signing macOS app (notarize if Apple credentials set)."
            fi
          fi
          npm run ${{ matrix.npm_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '12.0' || '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            build/release/*.exe
            build/release/*.dmg
            build/release/*.AppImage
            build/release/*.deb
          retention-days: 7

  # ── 第三步：将桌面产物附加到 GitHub Release（仅 tag 触发时） ────────────────
  # release.yml 负责创建 Release 并生成正文 / prerelease 标记；
  # 本工作流仅把桌面安装包附加到同名的 Release 上，不生成正文，避免与
  # release.yml 竞态覆盖 Release 正文。
  attach-to-release:
    name: Attach desktop artifacts to Release
    needs: build-electron
    runs-on: ubuntu-latest
    if: |
      needs.build-electron.result == 'success' && (
        startsWith(github.ref, 'refs/tags/') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
      )
    # softprops/action-gh-release@v2 needs write access to attach files to
    # an existing release. Default GITHUB_TOKEN is read-only at the job
    # level, so without this the action gets
    # 'Resource not accessible by integration' on PATCH /releases/:id.
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files/

      - name: Attach artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          files: release-files/**
          overwrite_files: true
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
