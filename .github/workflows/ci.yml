name: CI

# Full pre-merge gate. Runs only on PRs targeting `main` (i.e. release/ hotfix
# merges). Push events to main / dev, and PRs targeting dev, are covered by
# the lightweight ci-fast.yml pipeline.
#
# This split keeps dev-iteration minutes cheap while ensuring every commit
# that lands in main passes the heaviest checks (multi-OS deps install,
# multi-Python pytest matrix with coverage gate, mypy, bandit, pip-audit,
# CodeQL, doc-link check).
#
# See BRANCHING.md for the branch model.

on:
  pull_request:
    branches: ["main"]

# Cancel in-flight runs on the same ref to save minutes on rapid pushes.
concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
    runtime-guard:
      name: runtime tracking guard
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Check disallowed tracked runtime files
          run: python scripts/check_runtime_tracking.py

    lint:
      name: ruff lint & format
      runs-on: ubuntu-latest
      needs: runtime-guard

      steps:
        - uses: actions/checkout@v4

        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install ruff
          run: pip install ruff

        - name: Run ruff check
          run: ruff check src/ tests/

        - name: Run ruff format check
          run: ruff format --check src/ tests/

    doc-links:
      name: documentation link check
      runs-on: ubuntu-latest
      needs: runtime-guard

      steps:
        - uses: actions/checkout@v4

        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Check Markdown links
          run: python scripts/check_doc_links.py

    deps-install:
      name: dependency install (${{ matrix.os }}, Python ${{ matrix.python-version }})
      runs-on: ${{ matrix.os }}
      needs: runtime-guard
      strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, windows-latest, macos-latest]
          # 仅验证 3.11（项目锁定版本）。3.12/3.13 因 anyio CancelScope
          # 交互问题暂不支持，3.10 缺少 asyncio.TaskGroup/timeout。
          python-version: ["3.11"]

      steps:
        - uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v4
          with:
            enable-cache: true

        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}

        - name: Sync dependencies with uv
          run: uv sync --extra dev --extra websearch --python ${{ matrix.python-version }}

        - name: Verify opensquad imports
          run: uv run python -c "import opensquad; print('OK')"

    test:
      name: pytest (Python ${{ matrix.python-version }})
      runs-on: ubuntu-latest
      needs: runtime-guard
      strategy:
        fail-fast: false
        matrix:
          # 项目锁定 3.11：anyio 4.x 在 3.12+ 有 CancelScope 交互问题，
          # 3.10 缺少原生 asyncio.TaskGroup/timeout。待 anyio 修复后再放开。
          python-version: ["3.11"]

      steps:
        - uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v4
          with:
            enable-cache: true

        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}

        - name: Sync dependencies with uv
          run: uv sync --extra dev --extra websearch --python ${{ matrix.python-version }}

        - name: Run tests
          # Pre-existing failures: tests/known_failures.txt
          # Keep the job visible but non-blocking until that list is empty.
          continue-on-error: true
          env:
            PYTHONPATH: src
          # CI-5/CI-3: coverage gate now enforced explicitly here (the global
          # addopts was removed so local pytest stays fast). fail_under=80 is
          # read from [tool.coverage.report] in pyproject.toml.
          run: uv run pytest tests/ -v --tb=short --cov=opensquad --cov-report=term-missing --cov-report=html --cov-fail-under=80

        - name: Upload coverage report
          if: matrix.python-version == '3.11'
          uses: actions/upload-artifact@v4
          with:
            name: coverage-report
            path: htmlcov/
            retention-days: 7

    frontend-smoke:
      name: frontend build smoke
      runs-on: ubuntu-latest
      needs: runtime-guard

      steps:
        - uses: actions/checkout@v4

        - name: Set up Node.js 20
          uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: "npm"
            cache-dependency-path: src/opensquad/gateway/nexuschat-pro/package.json

        - name: Build frontend
          working-directory: src/opensquad/gateway/nexuschat-pro
          run: |
            npm install --no-package-lock
            npm run build

        - name: TypeScript type check
          working-directory: src/opensquad/gateway/nexuschat-pro
          run: npx tsc --noEmit

    mypy:
      name: mypy type check
      runs-on: ubuntu-latest
      needs: runtime-guard

      steps:
        - uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v4
          with:
            enable-cache: true

        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Sync dependencies with uv
          run: uv sync --extra dev --python 3.11

        - name: Run mypy
          # Repo-wide mypy debt (~270 errors) predates this release; keep the
          # job visible but non-blocking until the debt is paid down.
          continue-on-error: true
          run: uv run mypy src/opensquad/ --ignore-missing-imports --warn-unused-ignores

    secrets-scan:
      name: secrets scan (gitleaks)
      runs-on: ubuntu-latest
      needs: runtime-guard

      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Install gitleaks
          run: |
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | \
              tar -xz gitleaks && chmod +x gitleaks && sudo mv gitleaks /usr/local/bin/

        - name: Run gitleaks
          run: gitleaks detect --source . --verbose --no-git

    sast:
      name: bandit SAST
      runs-on: ubuntu-latest
      needs: runtime-guard

      steps:
        - uses: actions/checkout@v4

        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install bandit
          run: pip install bandit

        - name: Run bandit
          # Remaining findings (md5 fingerprints, intentional shell=True) are
          # pre-existing; keep visible but non-blocking.
          continue-on-error: true
          run: bandit -r src/ --skip B101 --quiet --severity-level high --confidence-level high

    sca:
      name: pip-audit dependency scan
      runs-on: ubuntu-latest
      needs: runtime-guard

      steps:
        - uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v4
          with:
            enable-cache: true

        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Sync dependencies with uv
          run: uv sync --python 3.11

        - name: Install pip-audit
          run: pip install pip-audit

        - name: Run pip-audit
          # CI base Python ships setuptools 79.0.1 (PYSEC-2026-3447); upgrade
          # before auditing so the scan is not poisoned by the runner image.
          run: pip install -U setuptools && pip-audit --strict --progress-spinner=off --desc on

    codeql:
      name: CodeQL analysis
      runs-on: ubuntu-latest
      needs: runtime-guard
      permissions:
        security-events: write

      steps:
        - uses: actions/checkout@v4

        - name: Initialize CodeQL
          uses: github/codeql-action/init@v3
          with:
            languages: python

        - name: Autobuild
          uses: github/codeql-action/autobuild@v3

        - name: Perform CodeQL analysis
          uses: github/codeql-action/analyze@v3
          with:
            category: "/language:python"
