# PR title lint — enforces Conventional Commits on every pull request.
#
# Combined with the local pre-commit hook (conventional-pre-commit) this
# gives two layers of defense:
#   - Local:  bad commit msg → `git commit` rejected before history is touched
#   - CI:     bad PR title   → GitHub check fails before merge is allowed
#
# The allowed types mirror commitlint.config.js. Scope is optional here
# (some folks prefer type-only titles); add `scopes:` to lock it down.
name: Lint PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits check
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Single source of truth for the allowed commit types.
          # Keep in sync with commitlint.config.js.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Optional scopes — enforce module-scoped titles.
          scopes: |
            opensquad
            gateway
            plugin
            nexuschat
            docs
            ci
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Subject must start with a lowercase letter. Examples:
              feat(gateway): add circuit breaker to chat API
              fix(plugin): handle missing skill metadata
              docs(readme): clarify install steps
          # Run on every PR — open, edit, and re-push.
          validateSingleCommit: false
