# ── OpenSquad pre-commit hooks ──────────────────────────────
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # ── Commit message lint (Conventional Commits) ─────────────
  # Rejects commits whose subject doesn't match the conventional
  # commit grammar. The companion commitlint.config.js defines the
  # exact rules. Install with:
  #   pip install conventional-pre-commit
  # and the hook activates automatically on `git commit`.
  # Bypass (NOT recommended): `git commit --no-verify`.
  - repo: local
    hooks:
      - id: sync-version
        name: sync version from pyproject.toml
        # Prefer plain python so Windows file locks on .venv Scripts/opensquad.exe
        # do not break commits when `uv run` tries to reinstall the editable package.
        entry: python scripts/sync_version.py
        language: system
        pass_filenames: false
        files: ^pyproject\.toml$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
